name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
        env:
          # Mocked in test setup — real keys not needed
          ANTHROPIC_API_KEY: test
          STRIPE_SECRET_KEY: test
          RESEND_API_KEY: test

      - name: Build
        run: npm run build
        env:
          # Stub values — real secrets live in Railway, not here
          ANTHROPIC_API_KEY: stub
          STRIPE_SECRET_KEY: stub
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: stub
          RESEND_API_KEY: stub
          RESEND_FROM_EMAIL: stub@stub.com
          RESEND_AUDIENCE_ID: stub
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: stub
          TURNSTILE_SECRET_KEY: stub
          NEXT_PUBLIC_APP_URL: http://localhost:3000
